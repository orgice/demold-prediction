# PR 검사: main에 합치기 전에 충돌과 깨진 코드를 막는다.
#   conflict  main과 충돌 없이 합쳐지는지, 충돌 표시(<<<<<<< / >>>>>>>)가 남지 않았는지
#   frontend  main과 합친 결과로 타입 검사 + 빌드 (npm run build = tsc -b && vite build)
#   backend   라이브러리 설치, 문법·import 검사, 빈 MariaDB로 서버를 띄워 API 응답 확인
# pull_request 검사는 GitHub가 만든 'PR + 최신 main 병합 결과'를 대상으로 돈다.
# 실패한 PR의 머지를 실제로 막으려면 저장소 설정에서 main 브랜치 보호 규칙에 이 검사들을 필수로 지정한다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 같은 PR에 새 커밋이 오면 이전 검사는 취소
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conflict:
    name: 충돌 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # PR이면 PR 브랜치 끝을 직접 받아 main과 합쳐 본다
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: main과 병합 시험
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --no-tags origin "$BASE"
          behind=$(git rev-list --count "HEAD..origin/$BASE")
          if [ "$behind" -gt 0 ]; then
            echo "::notice::이 브랜치는 $BASE 보다 커밋 ${behind}개 뒤처져 있습니다. 머지 전에 $BASE 을 합쳐 다시 확인하세요."
          fi
          if ! git merge --no-commit --no-ff "origin/$BASE" > /dev/null 2>&1; then
            echo "::error::$BASE 와 합칠 때 충돌이 납니다. 로컬에서 'git fetch origin && git merge origin/$BASE' 로 충돌을 정리한 뒤 다시 푸시하세요."
            echo "충돌 파일:"
            git diff --name-only --diff-filter=U | sed 's/^/  - /'
            exit 1
          fi
          echo "$BASE 와 충돌 없이 합쳐집니다."

      - name: 충돌 표시 남은 곳 검사
        run: |
          # 충돌을 정리하다 남긴 <<<<<<< / >>>>>>> 줄을 찾는다 (======= 는 마크다운에서도 쓰여서 제외)
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::충돌 표시가 남아 있습니다. 위 파일을 정리하세요."
            exit 1
          fi
          echo "남은 충돌 표시 없음"

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # Dockerfile(node:22-alpine)과 같은 버전
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: 라이브러리 설치
        run: npm ci
      - name: 타입 검사 + 빌드
        run: npm run build

  backend:
    name: 백엔드 실행 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp/backend
    services:
      db:
        image: mariadb:11.4        # docker-compose.yml과 같은 버전
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: demold
          MARIADB_USER: demold
          MARIADB_PASSWORD: demold
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://demold:demold@127.0.0.1:3306/demold?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"    # Dockerfile(python:3.12-slim)과 같은 버전
          cache: pip
          cache-dependency-path: webapp/backend/requirements.txt
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      - name: 문법·import 검사
        run: |
          python -m compileall -q app scripts
          python -c "import app.main"
      - name: 서버 시작과 API 응답 확인
        run: |
          # 시작할 때 테이블 생성·컬럼 추가(ALTER TABLE)가 도는지까지 확인한다
          uvicorn app.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done
          fail=0
          for path in /api/health /api/pours /api/pours/summary; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$path → $code"
            if [ "$code" != "200" ]; then fail=1; head -c 500 /tmp/body; echo; fi
          done
          if [ "$fail" = 1 ]; then
            echo "::error::백엔드 API가 200으로 응답하지 않았습니다. 아래 서버 로그를 확인하세요."
            cat /tmp/uvicorn.log
            exit 1
          fi
