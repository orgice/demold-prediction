# 프론트엔드 웹 서버 설정 (컨테이너 안 80번 → 내 컴퓨터 8080번)
# - /api/ 로 시작하는 요청은 백엔드 컨테이너(backend:8000)로 넘긴다
# - 나머지는 빌드된 화면 파일을 준다
server {
  listen 80;
  client_max_body_size 500m;   # 측압 CSV가 100MB 가까이 됨

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 900s;   # 큰 CSV 업로드·집계 대기
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;   # /pours/3 같은 화면 주소도 index.html로 (화면 이동은 React가 처리)
  }
}
