# 프론트엔드 웹 서버 설정 (컨테이너 안 80번 → 내 컴퓨터 8080번)
# - /api/ 로 시작하는 요청은 백엔드 컨테이너(backend:8000)로 넘긴다
# - 나머지는 빌드된 화면 파일을 준다
server {
  listen 80;
  client_max_body_size 500m;   # 측압 CSV가 100MB 가까이 됨

  # 접속한 사람의 실제 IP: 앞단 HTTPS 프록시(caddy, 도커 내부망)를 거쳐 왔으면 그쪽이 알려 준 IP를 쓴다
  # (로그인 잠금·변경 기록용. 운영에서는 8080을 외부에 열지 않으므로 이 헤더를 위조할 수 없다)
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header X-Real-IP $remote_addr;   # 사용자가 보낸 같은 이름의 헤더는 덮어쓴다
    proxy_read_timeout 900s;   # 큰 CSV 업로드·집계 대기
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;   # /pours/3 같은 화면 주소도 index.html로 (화면 이동은 React가 처리)
  }
}
